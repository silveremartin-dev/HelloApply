<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; color: #333; line-height: 1.6; margin: 0; padding: 60px 80px; background: #fff; }
        .contact-info { margin-bottom: 40px; }
        .date { text-align: right; margin-bottom: 40px; }
        .subject { font-weight: 600; margin-bottom: 30px; }
        .content { white-space: pre-line; }
        .signature { margin-top: 50px; }
    </style>
</head>
<body>
    <div class="contact-info">
        <strong>{{name}}</strong><br>
        {{address}}<br>
        {{email}}<br>
        {{phone}}
    </div>

    <div class="date">{{city}}, le {{date}}</div>

    <div class="subject">Objet : {{subject}}</div>

    <p>Madame, Monsieur,</p>

    <div class="content">{{content}}</div>

    <p>Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées.</p>

    <div class="signature">
        <strong>{{name}}</strong>
    </div>
</body>
</html>
